services:
  db:
    image: postgres:15-alpine
    container_name: postgres-guestmaster
    restart: always
    environment:
      POSTGRES_DB: guestmaster
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Elettronica1
    ports:
      - "5432:5432"

  web:
    build: .
    container_name: php-guestmaster
    restart: always
    ports:
      - "8088:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db