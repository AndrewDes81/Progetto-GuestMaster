version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: gestionale_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: miamiapassword
      POSTGRES_DB: gestionale_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

  web:
    build: .
    container_name: gestionale_php
    restart: always
    ports:
      - "8088:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

volumes:
  pgdata: