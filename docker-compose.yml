version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: postgres-guestmaster
    restart: always
    environment:
      POSTGRES_DB: guestmaster
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Elettronica1
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data  # <--- QUESTO MANCAVA E SALVA I DATI SUL DISCO

  web:
    build: .
    container_name: php-guestmaster
    restart: always
    ports:
      - "8088:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

volumes:
  pgdata:  # <--- DICHIARAZIONE DEL VOLUME PERSISTENTE